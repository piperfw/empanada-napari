name: Run pytests, build package and publish (main)

on:
  push:
    branches:
      - '**'

jobs:

  # Run pytests on all target platforms and python versions
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install napari[all]==0.6.6
          python -m pip install .[test]

      - name: Run tests
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python -m pytest -s -vv tests --ignore=tests/test_install.py --ignore=tests/test_install_extended.py

  # Build package using one python version; publish (PyPI) if on main
  build:
    needs: test # if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate build package
        run: twine check dist/*

      - name: Store dist for container build
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

      #- name: Publish to PyPI
      #  if: github.ref == 'refs/heads/main'
      #  run: python -m twine upload dist/*
      #  env:
      #    TWINE_USERNAME: __token__
      #    TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}
