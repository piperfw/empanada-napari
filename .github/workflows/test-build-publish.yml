name: Run pytests and conditionally build package and container (publishing if main)

on:
  push:
    branches:
      - '**'

jobs:

  # Run pytests on all target platforms and python versions
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install napari[all]==0.6.6
          python -m pip install .[test]

      - name: Run tests
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python -m pytest -s -vv tests --ignore=tests/test_install.py --ignore=tests/test_install_extended.py

  # Build package using one python version; publish (PyPI) if on main
  build:
    needs: test # if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate build package
        run: twine check dist/*

      - name: Store dist for container build
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 1

      #- name: Publish to PyPI
      #  if: github.ref == 'refs/heads/main'
      #  run: python -m twine upload dist/*
      #  env:
      #    TWINE_USERNAME: __token__
      #    TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}

  # Build and test Ubuntu 24 container with Python 3.12
  # On main: tag and push to GHCR, and sign
  build-container:
    needs: [test, build] # if tests AND build succeeds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (main only)
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - name: Download built package
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: container-dist/

      - name: Work out image name, tags and version
        id: meta
        run: |
          # GHCR requires a lower-case image name
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          # wheel filename: {name}-{version}-{python}-{abi}-{platform}.whl
          version="$(basename container-dist/*.whl | cut -d- -f2 | tr '+' '-')"
          {
            echo "image=${image}"
            echo "sha_tag=${image}:sha-${GITHUB_SHA::7}"
            echo "version=${version}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build container (local, for testing)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          tags: empanada-napari:ci
          build-args: |
            LOCAL_BUILD=true
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}

      - name: Container start-up tests (no GUI)
        run: docker run --rm -e EXIT_STATUS=true empanada-napari:ci /tests/run_container_tests.sh

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main only, after tests pass (use layers cached from above)
      # Adds SBOM and provenance attestations tags
      - name: Push container
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            LOCAL_BUILD=true
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.meta.outputs.created }}
 
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.0
 
      - name: Sign image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
