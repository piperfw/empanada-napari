name: Run tests, build package and container on pass (publish both if on main)

on:
  push:
    branches:
      - '**'

jobs: 
  # Run tests for supported platforms + Python versions
  tests:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        #python-version: ["3.10", "3.11", "3.12", "3.13"]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install napari[all]==0.6.6
          python -m pip install .[test]

      - name: Flag if coverage report should be generated
        shell: bash
        id: check_coverage
        run: |
          if [[ "${{ matrix.platform }}" == "ubuntu-latest" && "${{ matrix.python-version }}" == "3.12" ]]; then
            echo "needed=true" >> $GITHUB_OUTPUT
          else
            echo "needed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run tests (no coverage)
        if: steps.check_coverage.outputs.needed == 'false'
        run: python -m pytest -s -vv tests --ignore=tests/test_install.py --ignore=tests/test_install_extended.py
      
      - name: Run tests with coverage
        if: steps.check_coverage.outputs.needed == 'true'
        run: python -m pytest -s -vv tests --ignore=tests/test_install.py --ignore=tests/test_install_extended.py --cov=empanada_napari --cov-branch --cov-report=xml
      
      - name: Upload coverage to Codecov
        if: steps.check_coverage.outputs.needed == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

